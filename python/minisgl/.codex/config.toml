model_auto_compact_token_limit = 150000
model_auto_compact_token_limit_scope = "total"
tool_output_token_limit = 8000
experimental_compact_prompt_file = "../mini-sglang/python/minisgl/.codex/compact_prompt.txt"

[agents]
max_concurrent_threads_per_session = 1

[[hooks.SessionStart]]
matcher = "^(startup|resume|compact)$"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'context_hook_script="mini-sglang/python/minisgl/.codex/hooks/session_start.py"; if [ ! -f "$context_hook_script" ]; then context_hook_script="python/minisgl/.codex/hooks/session_start.py"; fi; if [ ! -f "$context_hook_script" ]; then context_hook_script=".codex/hooks/session_start.py"; fi; python3 "$context_hook_script"'
timeout = 20
statusMessage = "Loading mini-sglang project context"
additionalContextLimit = 5000
